<!doctype html>

<head>

  <meta name="description" content="Elevated nail art, made for you at Lark Nail Studio.">
  <title>Lark Nail Studio</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page" id="page">
    <header class="site-header">

        <span></span><span></span><span></span>

      <a class="wordmark" href="/" aria-label="Lark Nail Studio, home">

      <a class="button header-book" href="/booking">Book now</a>

        <p class="eyebrow">Gel <i>·</i> BIAB <i>·</i> Nail Art</p>
        <a class="button hero-book" href="/booking">Book appointment</a>

    </main>

  <div class="backdrop" hidden></div>
  <aside class="drawer" id="site-drawer" aria-label="Site navigation" aria-hidden="true" inert>

      <a href="/" class="drawer-logo" aria-current="page">LARK</a>
      <button class="drawer-close" type="button" aria-label="Close navigation"><span></span><span></span></button>
    </div>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="/services"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 13V3h8v10m-10 3h12v13H10zM14 23h4"/></svg><span>Services</span><b>›</b></a></li>
        <li><a href="/about"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="9" r="6"/><path d="M5 29c0-7 4.5-11 11-11s11 4 11 11z"/></svg><span>About Us</span><b>›</b></a></li>

        <a href="https://instagram.com/lark.nailstudio" aria-label="Lark Nail Studio on Instagram"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7"/><circle cx="16" cy="16" r="6"/><circle cx="24" cy="8" r="1"/></svg></a>
        <a href="mailto:hello@larknailstudio.example" aria-label="Email Lark Nail Studio"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="22" rx="2"/><path d="m3 7 13 11L29 7"/></svg></a>
